name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Lint
        run: |
          npm ci
          npm run lint
      - name: Backend
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web UI
        run: node --test web-ui/*.test.js

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pihurl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Starts the scripted model and target API, two containers from the image (one with an access
      # token), and drives them with a browser.
      - name: Browser tests
        run: e2e/run.sh pihurl:ci
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Images are published for release tags (v1.2.3), and only when the repository defines the
      # Docker Hub account (see README). Pushes to main and pull requests only build and smoke-test.
      PUBLISH: ${{ github.ref_type == 'tag' && vars.DOCKERHUB_USERNAME != '' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/pihurl
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build for this runner, start it and check it works, on every push and pull request.
      - name: Build (smoke test image)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pihurl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker-smoke.sh pihurl:ci

      # Publish on a v1.2.3 tag -> 1.2.3, 1.2, 1 and latest. amd64 and arm64.
      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH == 'true'
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
