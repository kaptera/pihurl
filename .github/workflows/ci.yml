name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Backend
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web UI
        run: node --test web-ui/*.test.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Publishing is on only when the repository defines the Docker Hub account (see README).
      PUBLISH: ${{ github.event_name == 'push' && vars.DOCKERHUB_USERNAME != '' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/pihurl
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      # Build for this runner, start it and check it works, on every push and pull request.
      - name: Build (smoke test image)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pihurl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker-smoke.sh pihurl:ci

      # Publish: main -> edge, v1.2.3 tags -> 1.2.3, 1.2, 1 and latest. amd64 and arm64.
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
